# DEPLOY BATTLE (versión simplificada) en Render (Blueprint), desde la rama "main" de este repositorio. Plan gratis: se duerme tras ~15 min sin uso (la primera visita tarda ~1 min).
services:
  - type: web
    name: deploy-battle-arcade
    runtime: docker
    plan: free
    region: frankfurt
    branch: main         # rama de despliegue de este repositorio
    healthCheckPath: /healthz
    autoDeploy: true     # cada push a "main" despliega solo
    envVars:
      - key: MAX_ROOMS
        value: "6"        # el plan gratis tiene poca CPU: pocas salas a la vez para que ninguna vaya a tirones
      - key: DEV_PASSWORD
        sync: false      # contraseña de /db-admin/ (modo desarrollador); se escribe a mano en Render
      - key: TURSO_DATABASE_URL
        sync: false      # configuraciones de mandos compartidas: libsql://<base>-<cuenta>.turso.io (a mano en Render)
      - key: TURSO_AUTH_TOKEN
        sync: false      # token de la base de Turso (a mano en Render; nunca en el repositorio)
      - key: SESSION_SECRET
        generateValue: true
