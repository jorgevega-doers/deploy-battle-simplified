<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="../../assets/logo/favicon.png">
  <title>DEPLOY BATTLE · ¿A qué jugamos?</title>
  <meta name="description" content="Batalla de tanques pixel art de DOERS DF: se juega en el ordenador, con teclado y ratón o con un mando, contra gente de cualquier sitio o contra los bots.">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../ui.css">
  <style>
    html, body.home { margin: 0; background: #070a14; }
    body.home { font-family: var(--font-ui); color: var(--white); }
    /* Página del móvil (aquí no se juega): tarjetas con el estilo de /end/ y SIN desplazarse; vertical, en columna; horizontal, el vídeo a la
       izquierda y lo demás a la derecha. Si aun así no cupiera, main.js la encoge (fitMobile). */
    body.mobile { --font-ui: 'Jersey 15', 'Tiny5', monospace; background-color: #070a14; background-image: repeating-conic-gradient(#0b1020 0 25%, transparent 0 50%); background-size: 8px 8px; overflow: hidden; }
    body.mobile, body.mobile html { min-height: 100dvh; }
    #mobile-page { display: flex; flex-direction: column; justify-content: center; min-height: 100dvh; gap: 10px; width: min(560px, 100%); margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); box-sizing: border-box; transform-origin: top center; font-family: var(--font-ui); }
    #mobile-page[hidden] { display: none; }
    .m-brand { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 12px 2px; }
    .m-brand::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--p1); }
    .m-brand a { line-height: 0; }
    .m-brand .sep { width: 2px; align-self: stretch; margin: 5px 0; background: #2c3756; }
    .m-brand .title-logo { display: block; height: 48px; width: auto; }
    .m-video { padding: 6px; }
    .m-video video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #05050c; image-rendering: pixelated; }
    .m-rec { display: flex; justify-content: space-between; margin-top: 5px; font-size: 15px; letter-spacing: 1px; color: #8e9abd; }
    .m-rec b { color: #ff4fa3; font-weight: 400; animation: m-rec 1.2s steps(1) infinite; }
    @keyframes m-rec { 50% { opacity: 0; } }
    .m-side { display: flex; flex-direction: column; gap: 10px; }
    .m-pc { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
    .m-ico { flex: none; width: 56px; height: 48px; image-rendering: pixelated; }
    .m-pc h2 { margin: 0; font-size: 26px; line-height: 1.05; font-weight: 400; color: var(--white); text-shadow: 3px 3px 0 var(--ui-blue); }
    .m-pc p { margin: 4px 0 0; font-size: 18px; line-height: 1.25; color: #c9d1ee; }
    .m-pc strong { color: var(--ui-amber); font-weight: 400; }
    .m-facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0; padding: 10px; list-style: none; }
    .m-facts li { padding: 1px 8px 2px; font-size: 16px; letter-spacing: 1px; color: var(--ui-muted); text-transform: uppercase; background: var(--ui-ink-2); border: 2px solid #2c3756; }
    .m-facts b { color: var(--ui-amber); font-weight: 400; }
    .m-links { display: flex; flex-direction: column; gap: 6px; }
    .ui-btn.m-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; font-size: 22px; text-decoration: none; box-sizing: border-box; }
    .ui-btn.m-btn.primary { --tab-img: var(--tab-img-p2); }
    .m-foot { margin: 0; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 15px; text-align: center; color: var(--ui-muted); }
    .m-doers { line-height: 0; }
    .m-foot a { color: var(--ui-muted); }
    /* Horizontal: vídeo a la izquierda, el resto a la derecha (en una pantalla de móvil tumbado no cabe en columna). */
    @media (orientation: landscape) {
      #mobile-page { width: min(900px, 100%); display: grid; grid-template-columns: 1.1fr 1fr; grid-template-areas: 'brand brand' 'video side'; align-items: start; align-content: center; }
      .m-brand { grid-area: brand; }
      .m-video { grid-area: video; }
      .m-side { grid-area: side; }
    }
  </style>
</head>
<body class="home">
  <!-- Móvil o tableta (sin ratón): aquí no se juega. Tarjetas como en /end/ y todo en una sola pantalla: logos, el vídeo de una partida real (grabado del
       propio juego), el aviso de que se juega en el ordenador, qué es el juego y los enlaces. En el ordenador, main.js lleva al juego (/). -->
  <main id="mobile-page" hidden>
    <header class="m-brand ui-panel" aria-label="DEPLOY BATTLE">
      <img class="title-logo" src="../../assets/logo/deploy-battle.png" alt="DEPLOY BATTLE" draggable="false">
    </header>
    <section class="m-video ui-panel">
      <video src="../../assets/preview/deploy-battle-preview.mp4" autoplay muted loop playsinline preload="auto" aria-label="Así es una partida de DEPLOY BATTLE"></video>
      <div class="m-rec"><span><b>●</b> PARTIDA REAL</span><span>1 CONTRA 3 BOTS</span></div>
    </section>
    <div class="m-side">
      <section class="m-pc ui-panel">
        <svg class="m-ico" viewBox="0 0 14 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#6f8cff" d="M0 0h14v9H0z"/><path fill="#05050c" d="M1 1h12v7H1z"/><path fill="#ff4fa3" d="M3 3h3v3H3z"/><path fill="#00f0ff" d="M8 4h3v1H8z"/><path fill="#6f8cff" d="M5 9h4v1H5zM3 10h8v2H3z"/></svg>
        <div>
          <h2>Se juega en el <strong>ordenador</strong></h2>
          <p>Ábrelo en tu PC y juega con <strong>teclado y ratón</strong> o con un <strong>mando</strong>.</p>
        </div>
      </section>
      <ul class="m-facts ui-panel" aria-label="El juego">
        <li><b>1-4</b> jugadores</li>
        <li><b>Online</b> contra cualquiera</li>
        <li>O contra <b>3 bots</b></li>
        <li>Partidas de <b>3 min</b></li>
      </ul>
      <nav class="m-links">
        <a class="ui-btn m-btn primary" href="/end/">SOBRE DOERS</a>
        <!-- Pie: el logo de DOERS va abajo (11-nov) -->
        <footer class="m-foot"><a class="m-doers" href="https://doersdf.com/es" target="_blank" rel="noopener" title="Conoce DOERS DF"><img class="doers-logo" data-px="1" src="../../assets/logo/logo-doers-small.png" alt="doers DF" draggable="false"></a><span><a href="https://doersdf.com/es/aviso-legal" target="_blank" rel="noopener noreferrer">Aviso legal</a> · <a href="/licencias/">Créditos y licencias</a></span></footer>
      </nav>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
